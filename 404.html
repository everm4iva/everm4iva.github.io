<!doctype html>
<html lang="en">
	<head>
		<title>404</title>
		<link rel="shortcut icon" href="./media/icons/b1.png" type="image/png" />
		<meta name="robots" content="none, translate, noarchive, nosnippet" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="OOPS, something went wrong" />
		<link rel="stylesheet" href="./media/styles/root.css" />
		<style>
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				padding: 0;
				background: var(--bg-color);
				display: flex;
				justify-content: center;
				align-items: center;
				min-height: 100vh;
				font-family: MarkerGothic, sans-serif;
				overflow: hidden;
				user-select: none;
				-moz-user-select: none;
				-webkit-user-drag: none;
			}
			h1 {
				position: absolute;
				top: 80%;
				left: 50%;
				transform: translate(-50%, -50%);
				font-size: 1.5rem;
				color: var(--pink);
				text-decoration: underline;
				cursor: pointer;
				margin: 0;
				transition: transform 0.2s;
			}
			h2 {
				color: var(--yellow);
				position: absolute;
				top: 88%;
				left: 50%;
				transform: translate(-50%, -50%);
				font-size: 1rem;
				margin: 0;
			}
		</style>
	</head>
	<body>
			<img src="./media/images/Just404.svg" style="width: 40%" class="imgBlock" />
			<h2 translate="yes">Page unavaliable or deleted</h2>
			<h1 translate="yes"><a id="returnLink" href="./">✦ click here to return ✦</a></h1>

		<script src="./media/lib/gsap-min.js"></script>
		<script>
			const img = document.querySelector('.imgBlock');
			const returnLink = document.querySelector('#returnLink');
			const svgFilter = `
<svg style="position: absolute; width: 0; height: 0;">
  <defs>
    <filter id="wave-distortion">
      <feTurbulence
        id="turbulence" 
        type="fractalNoise" 
        baseFrequency="0.02 0.06"
        numOctaves="8"
        result="noise"
      />
      <feDisplacementMap 
        in="SourceGraphic" 
        in2="noise"
        scale="10"
      />
    </filter>
  </defs>
</svg>
`;

			document.body.insertAdjacentHTML('beforeend', svgFilter);
			img.style.filter = 'url(#wave-distortion)';

			returnLink.addEventListener('click', (event) => {
				event.preventDefault();
				const canGoBack = window.history.length > 1 && document.referrer !== '';
				if (canGoBack) {
					window.history.back();
					return;
				}
				window.location.href = './';
			});

			gsap.to('#turbulence', {
				attr: {baseFrequency: '1.80 1.60'},
				duration: 800,
				yoyo: true,
				repeat: -1,
				ease: 'sine',
			});
		</script>
	</body>
</html>

<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, notranslate" />
		<title>@project-banner</title>
		<link rel="stylesheet" href="../../styles/root.css" />
	</head>
	<style>
		body::before {
			background-image: none;
		}
		body {
			overflow-y: auto;
		}
		.img-block {
			display: flex;
			flex-wrap: wrap;
			width: 100%;
		}
		.img-block img {
			margin: 0.5%;
			flex: 1 1 30%;
			max-width: 12%;
			height: auto;
			object-fit: contain;
			background-color: rgba(255, 255, 255, 0.5);
			image-rendering: pixelated;
		}
		.img-block img:hover {
			filter: opacity(0.7);
		}
		blockquote {
			margin-top: 3%;
		}
	</style>
	<body>
		<h1>Indexed on <mark>media/base/@project-banner</mark></h1>
		<ul>
			<p></p>
			<li><a href="../">/..</a></li>
		</ul>

		<div class="img-block">
			<img src="./bubble1.png" alt="bubble1(png)" />
			<img src="./Ocean1.png" alt="Ocean1 (png)" />
			<img src="./oceanboardstar.png" alt="oceanboardstar (png)" />
			<img src="./SimplyPrivate1.jpg" alt="SimplyPrivate1 (jpg)" />
			<img src="./spthinglogsstuffblahblah.png" alt="spthinglogsstuffblahblah (png)" />
		</div>

</html>

<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, notranslate" />
		<title>media/icons</title>
		<link rel="stylesheet" href="../styles/root.css" />
	</head>
	<style>
		body::before {
			background-image: none;
		}
		body {
			overflow-y: auto;
		}
		.img-block {
			display: flex;
			flex-wrap: wrap;
			width: 100%;
		}
		.img-block img {
			margin: 0.5%;
			flex: 1 1 30%;
			max-width: 12%;
			height: auto;
			object-fit: contain;
			background-color: rgba(255, 255, 255, 0.5);
			image-rendering: pixelated;
		}
		.img-block img:hover {
			filter: opacity(0.7);
		}
		blockquote {
			margin-top: 3%;
		}
	</style>
	<body>
		<h1>Indexed on <mark>/media/icons</mark></h1>
		<ul>
			<p></p>
			<li><a href="../">/..</a></li>

		<div class="img-block">
			<img src="./b1.png" alt="b1 (png)" />
			<img src="./note.png" alt="note (png)" />
            <img src="./Star.bg.png" alt="Star.bg (png)" />
            <img src="./Star.bg.svg" alt="Star.bg (svg)" />
            <img src="./Star.T.png" alt="Star.t (png)" />
            <img src="./Star.T.svg" alt="Star.t (svg)" />
            <img src="./favicon.ico" alt="favicon (ico)" />
		</div>
	</body>
</html>
